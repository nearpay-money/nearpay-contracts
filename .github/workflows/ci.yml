name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # bash -eo pipefail

env:
  # Native lint/unit toolchain (the version these were verified with).
  RUST_VERSION: "1.97.0"
  # Wasm toolchain = the reproducible image's (sourcescan/cargo-near:0.22.0-rust-1.99.1 in
  # contracts/subscription-vault/Cargo.toml), so mocks and vault are built like the deployed wasm.
  RUST_WASM_VERSION: "1.99.1"
  CARGO_NEAR_VERSION: "0.22.0"
  CARGO_FUZZ_VERSION: "0.13.2"
  FUZZ_NIGHTLY: "nightly-2026-11-01"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        env:
          # Linting does not need the near-workspaces sandbox binary.
          NEAR_SANDBOX_BIN_PATH: /nonexistent
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  unit:
    name: unit + proptest + parser fuzz (native)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: cargo test (subscription-vault)
        env:
          PROPTEST_CASES: "256"
        run: cargo test -p subscription-vault --locked -- --test-threads=4

  wasm:
    name: build wasm (cargo-near, non-reproducible; mocks for the sandbox tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_WASM_VERSION }} + wasm32
        run: |
          rustup toolchain install "$RUST_WASM_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_WASM_VERSION"
      - name: System packages for cargo-near
        run: sudo apt-get update -q && sudo apt-get install -yq libudev-dev pkg-config
      - name: Install cargo-near ${{ env.CARGO_NEAR_VERSION }} (pinned, --locked, no cache)
        run: cargo install cargo-near --version "$CARGO_NEAR_VERSION" --locked
      - name: Build contracts
        run: scripts/build.sh
      - name: Sizes and hashes
        run: |
          {
            echo "### wasm (non-reproducible; the sandbox tests use the reproducible vault)"
            echo '```'
            ls -l res/*.wasm
            cat res/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: res/
          if-no-files-found: error

  integration:
    name: near-workspaces integration + gas profile (reproducible vault wasm)
    needs: [wasm, reproducible]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: res
      - uses: actions/download-artifact@v4
        with:
          name: vault-reproducible
          path: res-reproducible
      - name: Test the deployable vault bytes (M-7)
        run: |
          cp res-reproducible/subscription_vault.wasm res/subscription_vault.wasm
          (cd res-reproducible && sha256sum -c SHA256SUMS)
          echo "vault under test: $(sha256sum res/subscription_vault.wasm)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: cargo test (integration-tests)
        env:
          NEARPAY_WASM_DIR: ${{ github.workspace }}/res
        run: cargo test -p integration-tests --locked -- --nocapture --test-threads=4 2>&1 | tee integration.log
      - name: near-sandbox binary checksum
        if: always()
        env:
          EXPECTED: ${{ vars.NEAR_SANDBOX_SHA256 }}
        run: |
          bins=$(find "$HOME" target -type f -name 'near-sandbox*' -perm -u+x 2>/dev/null | grep -v '\.d$' || true)
          for b in $bins; do sha256sum "$b"; done | tee sandbox.sha256
          echo "near-sandbox: $(cat sandbox.sha256)" >> "$GITHUB_STEP_SUMMARY"
          # Pin by setting the repository variable NEAR_SANDBOX_SHA256 to the hash printed here.
          if [[ -n "$EXPECTED" ]]; then grep -q "^$EXPECTED " sandbox.sha256; fi
      - name: Gas profile
        if: always()
        run: |
          {
            echo "### Gas profile (target: collect ≤ 60 Tgas burnt excluding the receiver)"
            echo '```'
            grep '^GAS' integration.log || echo "no gas lines (tests did not reach the profile)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  reproducible:
    name: reproducible vault wasm (Docker, built twice)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # PR runs build the PR head commit (a real branch commit), not the ephemeral merge ref,
          # so the embedded NEP-330 source link stays resolvable. Deploy only hashes from `push`
          # runs on main (LLD §6, re-audit N-2).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust ${{ env.RUST_WASM_VERSION }} + wasm32
        run: |
          rustup toolchain install "$RUST_WASM_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_WASM_VERSION"
      - name: System packages for cargo-near
        run: sudo apt-get update -q && sudo apt-get install -yq libudev-dev pkg-config
      - name: Install cargo-near ${{ env.CARGO_NEAR_VERSION }} (pinned, --locked, no cache)
        run: cargo install cargo-near --version "$CARGO_NEAR_VERSION" --locked
      - name: Reproducible build 1
        env:
          NEARPAY_WASM_DIR: ${{ github.workspace }}/res-reproducible
        run: scripts/build.sh --reproducible
      - name: Reproducible build 2 (must match)
        env:
          NEARPAY_WASM_DIR: ${{ runner.temp }}/res-reproducible-2
        run: |
          scripts/build.sh --reproducible
          diff res-reproducible/SHA256SUMS "$NEARPAY_WASM_DIR/SHA256SUMS"
      - name: Hash
        run: |
          {
            echo "### Reproducible vault wasm (candidate — deployable only if the final 'deployable' job of a push run on main prints it; LLD §6)"
            echo '```'
            ls -l res-reproducible/*.wasm
            cat res-reproducible/SHA256SUMS
            echo "commit: $(git rev-parse HEAD)"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: vault-reproducible
          path: res-reproducible/
          if-no-files-found: error

  fuzz:
    name: cargo-fuzz (msg parser)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ${{ env.FUZZ_NIGHTLY }} + cargo-fuzz ${{ env.CARGO_FUZZ_VERSION }}
        run: |
          rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
          cargo +"$FUZZ_NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Fetch fuzz dependencies from the committed lockfile (fails on drift before running)
        run: cargo +"$FUZZ_NIGHTLY" fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Fuzz parse_msg (180 s)
        run: cargo +"$FUZZ_NIGHTLY" fuzz run --sanitizer none parse_msg -- -max_total_time=180 -max_len=4096
      - name: fuzz/Cargo.lock unchanged (committed dependency set)
        run: git diff --exit-code fuzz/Cargo.lock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  deployable:
    name: deployable hash (push to main, every job green)
    # Runs only on push to main and only when every other job succeeded (implicit success()).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, unit, wasm, integration, reproducible, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vault-reproducible
          path: res-reproducible
      - name: Publish the deployable hash
        run: |
          (cd res-reproducible && sha256sum -c SHA256SUMS)
          {
            echo "### DEPLOYABLE vault wasm (LLD §6: deploy only this, from a run whose conclusion is success)"
            echo '```'
            cat res-reproducible/SHA256SUMS
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
