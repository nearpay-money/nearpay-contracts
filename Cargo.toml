[workspace]
resolver = "3"
members = [
    "contracts/subscription-vault",
    "contracts/mocks/mock-ft",
    "contracts/mocks/mock-intents",
    "integration-tests",
]
# cargo-fuzz target: built only by CI (nightly), see fuzz/Cargo.toml.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/nearpay-money/nearpay-contracts"

[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
near-workspaces = { version = "=0.24.0", default-features = false, features = ["install", "rustls"] }
proptest = "=1.12.0"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Smaller native test artefacts (shared CI/dev machines are disk-constrained).
[profile.dev]
debug = 0

[profile.dev.package.proptest]
opt-level = 2
