[package]
name = "subscription-vault"
description = "NearPay subscription vault: payer-funded, payer-cancellable NEP-141 mandates with permissionless collect"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
# Image referenced by the cargo-near 0.23.0 project template (cargo-near 0.22.0, Rust 1.99.1); it is
# identified by the digest, the tag is descriptive. CI builds the mocks with the same versions
# and runs the sandbox tests against this reproducible vault wasm.
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
proptest = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
